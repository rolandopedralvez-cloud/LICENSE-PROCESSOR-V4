name: Build Windows desktop app (.exe)

# Packages desktop.py (the pywebview desktop wrapper around the FastAPI app)
# into a single-file Windows .exe with PyInstaller, so it can be run on a
# Windows PC without installing Python or any dependency yourself.
#
# NOTE: this does NOT bundle telco.db, index.html, or the RSL print
# templates (PRINT_ready.xlsx / RSL_Format_2025_mapped.docx) -- those hold
# your live data / are provided per-install, exactly like today with
# start.bat. Put the built .exe in the same folder as those files (or copy
# them next to the .exe) before running it.
#
# How to run this:
#   1. Push/merge this file to the repo (already done if you're reading it
#      from a checked-in copy).
#   2. On GitHub: Actions tab -> "Build Windows desktop app (.exe)" ->
#      "Run workflow" (the workflow_dispatch trigger below) -> Run.
#   3. When it finishes (a few minutes), open the completed run and
#      download the "NTC-Licensing-windows-exe" artifact -- that's a zip
#      containing NTC-Licensing.exe.
#   4. Optionally: push a tag like "v1.0.0" instead of/in addition to a
#      manual run to also attach the .exe to a GitHub Release.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NTC-Licensing" `
            --add-data "app/templates;app/templates" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            desktop.py

      - name: Stage a ready-to-run folder
        run: |
          mkdir dist\NTC-Licensing-portable
          copy dist\NTC-Licensing.exe dist\NTC-Licensing-portable\
          copy index.html dist\NTC-Licensing-portable\
          copy create_db.py dist\NTC-Licensing-portable\
          copy set_login.py dist\NTC-Licensing-portable\
          if (Test-Path README.md) { copy README.md dist\NTC-Licensing-portable\ }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTC-Licensing-windows-exe
          path: dist/NTC-Licensing-portable/

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NTC-Licensing.exe
