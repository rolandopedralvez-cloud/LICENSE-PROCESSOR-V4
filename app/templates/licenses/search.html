{% extends "base.html" %}
{% block title %}Search Licenses — NTC{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-1">Search Licenses</h1>
<p class="text-sm text-gray-500 mb-4">
  New HTMX-powered search — the classic UI is still at <a class="underline" href="/">/</a>.
</p>

<input
  type="search"
  name="q"
  value="{{ q }}"
  placeholder="Licensee, license no., or site name..."
  class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
  hx-get="/search-ui/results"
  hx-trigger="keyup changed delay:300ms, search"
  hx-target="#results"
  hx-indicator="#spinner"
  autocomplete="off"
>
<span id="spinner" class="htmx-indicator text-sm text-gray-400">Searching…</span>

<div id="results">
  {% include "licenses/_results.html" %}
</div>
{% endblock %}
