<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NTC Licensing{% endblock %}</title>
  <script>
    // Apply the cached theme/font/size instantly, before first paint, so
    // there's no flash of the wrong look. The authoritative copy lives on
    // the account (users.theme/font_family/font_size in app/core.py) and
    // reaches the browser via the login response's "prefs" field and
    // GET /api/my-preferences -- this is just a same-device cache of the
    // last known values so we don't wait on a network round-trip first.
    (function () {
      try {
        var raw = localStorage.getItem('ntc_prefs');
        var prefs = raw ? JSON.parse(raw) : null;
        var root = document.documentElement;
        root.dataset.theme = (prefs && prefs.theme) || 'light';
        root.dataset.font = (prefs && prefs.font_family) || 'sans';
        root.dataset.fontsize = (prefs && prefs.font_size) || 'md';
      } catch (e) {}
    })();
  </script>
  <script src="/static/vendor/htmx.min.js"></script>
  <!-- Tailwind, built ahead of time into one small stylesheet ----------
       This was <script src="https://cdn.tailwindcss.com"></script>, which
       downloads a ~400KB compiler on EVERY page load and needs the internet
       to work at all. app/static/vendor/tailwind.css is the same styling
       compiled down to only the classes this app actually uses (about 30KB),
       so pages render instantly and work with no connection.

       The brand purple / sidebar colours that used to be configured in the
       tailwind.config block below are baked into that file.

       IF YOU EVER ADD NEW TAILWIND CLASSES to a template that weren't used
       anywhere before, they won't be in this file yet. Ask Claude to rebuild
       app/static/vendor/tailwind.css and the new classes will be included. -->
  <link rel="stylesheet" href="/static/vendor/tailwind.css">
  <style>
    .htmx-indicator{opacity:0;transition:opacity .15s ease-in}
    .htmx-request.htmx-indicator,.htmx-request .htmx-indicator{opacity:1}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-thumb{background:#c7c7d1;border-radius:4px}

    /* ---- Expandable map (Analytics, Location Check, license edit form's
       pin map) -- an "Expand" button toggles the map's own wrapper to a
       full-screen overlay; see ntcExpandMap() below. */
    .ntc-map-wrap { position: relative; }
    .ntc-map-wrap.ntc-map-fullscreen {
      position: fixed; inset: 12px; z-index: 9999; background: #fff;
      border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.35); padding: 8px;
    }
    .ntc-map-wrap.ntc-map-fullscreen > div[id$="map"],
    .ntc-map-wrap.ntc-map-fullscreen [id^="an-map"],
    .ntc-map-wrap.ntc-map-fullscreen [id^="locmap"],
    .ntc-map-wrap.ntc-map-fullscreen [id^="pin-map"],
    .ntc-map-wrap.ntc-map-fullscreen [id^="batch-map"],
    .ntc-map-wrap.ntc-map-fullscreen [id^="br-map"] {
      height: 100% !important;
    }
    .ntc-map-close {
      position: absolute; top: 14px; right: 14px; z-index: 10000;
      width: 30px; height: 30px; border-radius: 999px; background: #1f2937; color: #fff;
      font-size: 18px; line-height: 1; border: none; cursor: pointer;
    }
    .ntc-map-close:hover { background: #111827; }

    /* ---- Account Preferences: font family / size (app/routers/settings.py,
       /api/my-preferences) --------------------------------------------- */
    :root { --ntc-font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; --ntc-font-size: 16px; }
    :root[data-font="serif"] { --ntc-font-family: Georgia, Cambria, 'Times New Roman', Times, serif; }
    :root[data-font="mono"] { --ntc-font-family: ui-monospace, 'Cascadia Code', 'Courier New', monospace; }
    :root[data-fontsize="sm"] { --ntc-font-size: 14px; }
    :root[data-fontsize="md"] { --ntc-font-size: 16px; }
    :root[data-fontsize="lg"] { --ntc-font-size: 18px; }
    :root[data-fontsize="xl"] { --ntc-font-size: 20px; }
    html { font-size: var(--ntc-font-size); }
    body { font-family: var(--ntc-font-family); }

    /* ---- Account Preferences: dark theme ------------------------------
       Tailwind is loaded via the CDN script with no dark: variant
       configured, and templates use plain gray-scale utility classes
       everywhere, so instead of a `dark:` retrofit of every template this
       overrides the handful of gray/white utility classes actually in use
       once data-theme="dark" is set on <html>. Covers the common
       surfaces (page background, cards, text, borders, inputs, tables);
       not pixel-perfect everywhere, but keeps the app comfortably usable
       in low light. */
    :root[data-theme="dark"] body { background-color: #0f1117; color: #e5e7eb; }
    :root[data-theme="dark"] .bg-gray-100 { background-color: #0f1117 !important; }
    :root[data-theme="dark"] .bg-white,
    :root[data-theme="dark"] .bg-gray-50 { background-color: #1c1f2b !important; }
    :root[data-theme="dark"] .text-gray-900,
    :root[data-theme="dark"] .text-gray-800,
    :root[data-theme="dark"] .text-gray-700 { color: #e5e7eb !important; }
    :root[data-theme="dark"] .text-gray-600,
    :root[data-theme="dark"] .text-gray-500,
    :root[data-theme="dark"] .text-gray-400 { color: #9ca3af !important; }
    :root[data-theme="dark"] .border-gray-100,
    :root[data-theme="dark"] .border-gray-200,
    :root[data-theme="dark"] .border-gray-300 { border-color: #2d3140 !important; }
    :root[data-theme="dark"] input,
    :root[data-theme="dark"] select,
    :root[data-theme="dark"] textarea {
      background-color: #1c1f2b !important; color: #e5e7eb !important; border-color: #2d3140 !important;
    }
    :root[data-theme="dark"] thead.bg-gray-50,
    :root[data-theme="dark"] tr.hover\:bg-gray-50:hover { background-color: #23273a !important; }
    :root[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #3f4356; }
  </style>
  <script>
  // ---------------------------------------------------------------------
  // Auth glue for the new HTMX/Jinja2 UI (/app/*). Deliberately reuses the
  // EXACT same localStorage keys the existing index.html already uses
  // (ntc_token / ntc_role / ntc_user / ntc_perms) so logging in on either
  // UI works on both -- there is only one session, not two.
  //
  // Why this exists at all: every /api/* route is guarded by a middleware
  // in app/main.py that requires an "Authorization: Bearer <token>"
  // header. A normal browser page navigation or <a href> can't attach a
  // custom header, and htmx doesn't send one by default either -- so
  // without this, every write/read against /api/* from the new UI would
  // 401 even for a logged-in user. This listens for htmx's
  // configRequest event and injects the header from localStorage on
  // every htmx-driven request; ntcFetch() below does the same for plain
  // fetch() calls (used for create/edit/delete forms, which POST/PUT/
  // DELETE directly against the existing JSON API rather than an
  // HTML-returning endpoint).
  // ---------------------------------------------------------------------
  (function () {
    const TOKEN_KEY = "ntc_token";

    window.ntcToken = function () {
      return localStorage.getItem(TOKEN_KEY) || "";
    };
    window.ntcUser = function () {
      return localStorage.getItem("ntc_user") || "";
    };
    window.ntcRole = function () {
      return localStorage.getItem("ntc_role") || "";
    };
    window.ntcAuthed = function () {
      return !!window.ntcToken();
    };
    window.ntcLogout = function () {
      localStorage.removeItem("ntc_token");
      localStorage.removeItem("ntc_role");
      localStorage.removeItem("ntc_user");
      localStorage.removeItem("ntc_perms");
      localStorage.removeItem("ntc_prefs");
      window.location.href = "/app/login";
    };

    // Account Preferences (theme/font/display name/avatar) -- see
    // /api/my-preferences in app/routers/settings.py. ntcPrefs() reads the
    // same-device cache (kept in sync at login and by _shell.html's
    // background refresh); ntcApplyPrefs() is the one place that both
    // updates the cache and re-applies theme/font to the live page, used
    // by the Account Preferences form on Settings for an instant preview
    // and by _shell.html after fetching a fresh copy from the server.
    window.ntcPrefs = function () {
      try { return JSON.parse(localStorage.getItem("ntc_prefs") || "null") || {}; } catch (e) { return {}; }
    };
    window.ntcApplyPrefs = function (prefs) {
      if (!prefs) return;
      const root = document.documentElement;
      if (prefs.theme) root.dataset.theme = prefs.theme;
      if (prefs.font_family) root.dataset.font = prefs.font_family;
      if (prefs.font_size) root.dataset.fontsize = prefs.font_size;
      try {
        const merged = Object.assign({}, window.ntcPrefs(), prefs);
        localStorage.setItem("ntc_prefs", JSON.stringify(merged));
      } catch (e) {}
    };
    // Redirect to login unless we already have a token. Call this at the
    // top of any /app/* page that requires a signed-in user (every page
    // except /app/login itself).
    window.ntcRequireAuth = function () {
      if (!window.ntcAuthed()) {
        window.location.href = "/app/login";
      }
    };
    // fetch() wrapper for the create/edit/delete forms: attaches the
    // bearer token + JSON content type, and bounces to login on a 401
    // (expired/invalid token) instead of leaving the user looking at a
    // silently-failed request.
    window.ntcFetch = async function (url, options) {
      options = options || {};
      options.headers = Object.assign(
        {},
        options.headers,
        {
          Authorization: "Bearer " + window.ntcToken(),
          "Content-Type": "application/json",
        }
      );
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = "/app/login";
        throw new Error("not authenticated");
      }
      return res;
    };

    // Escapes a value for safe insertion into innerHTML. Every /app/* page
    // builds its list/table rows by string-concatenating data straight from
    // the API (licensee names, remarks, site names, filenames, activity-log
    // detail text, etc.) into innerHTML -- fields a normal user can type
    // freely. Without escaping, a value containing e.g. "<img src=x
    // onerror=...>" would execute as real HTML/JS for the next person who
    // views that list (a classic stored-XSS hole). This is the one place
    // that escaping happens; every page's row-building code wraps
    // user-controlled values in this before concatenating them in.
    // (Static, hardcoded label strings -- "No results.", column headers,
    // etc. -- don't need it; only values that came from the server/DB do.)
    window.ntcEsc = function (v) {
      if (v === null || v === undefined) return '';
      return String(v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    };

    // Safe JSON fetch wrapper built on top of ntcFetch(). Every /app/*
    // page was previously doing its own "res.json().then(body => ({ok,
    // body}))" dance, which breaks (uncaught rejection, silent failure)
    // if the server ever answers with something that isn't valid JSON --
    // a proxy timeout page, a stack trace from an unrelated 500, an empty
    // body on a 204, etc. This normalizes all of that into one shape:
    // { ok, status, body } where body is best-effort-parsed JSON (or null
    // if there was nothing parseable), and NEVER throws for an HTTP error
    // status -- only for an actual network failure (server unreachable),
    // which callers should still wrap in try/catch.
    window.ntcFetchJSON = async function (url, options) {
      const res = await window.ntcFetch(url, options);
      let body = null;
      try {
        const text = await res.text();
        body = text ? JSON.parse(text) : null;
      } catch (e) {
        body = null;
      }
      return { ok: res.ok, status: res.status, body: body };
    };

    // Wraps a button's click handler so the button disables itself and
    // shows a spinner for the duration of an in-flight async action --
    // prevents double-submits (double-clicking Delete, Save, Batch Renew,
    // etc. and firing the request twice) across every write action in
    // the app, not just one page's worth.
    window.ntcBusy = async function (btn, fn) {
      if (!btn || btn.disabled || btn.dataset.busy === '1') return; // already running -- ignore the extra click
      const original = btn.innerHTML;
      btn.disabled = true; // no-op on <a> tags, harmless
      btn.dataset.busy = '1'; // the actual guard for non-<button> elements like row action links
      btn.classList.add('opacity-60', 'cursor-not-allowed', 'pointer-events-none');
      btn.innerHTML = '<svg class="inline w-3.5 h-3.5 mr-1 animate-spin" fill="none" viewBox="0 0 24 24">' +
        '<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>' +
        '<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>' +
        original;
      try {
        await fn();
      } finally {
        btn.disabled = false;
        delete btn.dataset.busy;
        btn.classList.remove('opacity-60', 'cursor-not-allowed', 'pointer-events-none');
        btn.innerHTML = original;
      }
    };

    // Renders a standard "couldn't load this, here's why, try again" state
    // inside any container -- used by every list-loading page (Trash,
    // Users, Activity Log, Import Flags, Scan Quarantine, Location Check,
    // Analytics, OR Batches...) instead of each one hand-rolling its own
    // dead-end error text with no way to recover except a full page reload.
    // colspan=0 renders a plain block (for non-table containers); pass the
    // table's column count otherwise so the row spans correctly.
    window.ntcErrorState = function (message, retryFnName, colspan) {
      const btn = '<button onclick="' + retryFnName + '()" ' +
        'class="mt-2 text-xs font-medium text-brand-600 border border-brand-200 rounded-md px-3 py-1 hover:bg-brand-50">Retry</button>';
      const inner = '<div class="py-8 text-center text-red-500 text-sm">' + message + '<br>' + btn + '</div>';
      if (colspan) return '<tr><td colspan="' + colspan + '">' + inner + '</td></tr>';
      return inner;
    };

    // Small shared toast helper so every /app/* page can show a
    // success/error message the same way without re-implementing it.
    // Not tied to any one feature -- used across Users, Import, Scan
    // Review, Trash, Batch Renew, etc.
    window.ntcToast = function (msg, isError) {
      let box = document.getElementById("ntc-toast");
      if (!box) {
        box = document.createElement("div");
        box.id = "ntc-toast";
        box.className = "fixed bottom-4 right-4 z-50 flex flex-col gap-2 items-end";
        document.body.appendChild(box);
      }
      const el = document.createElement("div");
      el.className = "px-4 py-2.5 rounded-md shadow-lg text-sm font-medium text-white max-w-sm " +
        (isError ? "bg-red-600" : "bg-emerald-600");
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function () {
        el.style.transition = "opacity .3s ease";
        el.style.opacity = "0";
        setTimeout(function () { el.remove(); }, 300);
      }, 3200);
    };

    // Shared "expand map to full screen" wiring -- used by Analytics, the
    // license edit form's pin map, and Location Check. wrapId is the
    // .ntc-map-wrap div around the map; expandBtnId/collapseBtnId are the
    // two buttons; getMap is a function returning the current Leaflet map
    // instance (may be null before the map's been created yet) so it can
    // be told to invalidateSize() once the layout settles.
    window.ntcExpandMap = function (wrapId, expandBtnId, collapseBtnId, getMap) {
      const wrap = document.getElementById(wrapId);
      const expandBtn = document.getElementById(expandBtnId);
      const collapseBtn = document.getElementById(collapseBtnId);
      if (!wrap || !expandBtn || !collapseBtn) return;
      function settle() {
        setTimeout(function () { const m = getMap && getMap(); if (m) m.invalidateSize(); }, 220);
      }
      function enter() {
        wrap.classList.add('ntc-map-fullscreen');
        collapseBtn.classList.remove('hidden');
        document.addEventListener('keydown', onEsc);
        settle();
      }
      function exit() {
        wrap.classList.remove('ntc-map-fullscreen');
        collapseBtn.classList.add('hidden');
        document.removeEventListener('keydown', onEsc);
        settle();
      }
      function onEsc(e) { if (e.key === 'Escape') exit(); }
      expandBtn.addEventListener('click', enter);
      collapseBtn.addEventListener('click', exit);
    };

    document.addEventListener("htmx:configRequest", function (evt) {
      const t = window.ntcToken();
      if (t) evt.detail.headers["Authorization"] = "Bearer " + t;
    });
    document.addEventListener("htmx:responseError", function (evt) {
      if (evt.detail.xhr && evt.detail.xhr.status === 401) {
        window.location.href = "/app/login";
      }
    });
  })();
  </script>
</head>
<body class="bg-gray-100 text-gray-900">
  <!-- ---- Offline / blocked-CDN notice ------------------------------------
       Tailwind, htmx and Leaflet are loaded from the internet. On an office
       PC with no connection (or behind a filter) those requests fail and the
       app renders as unstyled text with dead buttons -- which looks like the
       app itself is broken, with nothing on screen explaining why. This says
       what actually happened, in plain language, instead of leaving someone
       guessing. It only ever appears when a required file really is missing. -->
  <div id="ntc-offline-banner"
       style="display:none;position:fixed;top:0;left:0;right:0;z-index:99999;
              background:#b45309;color:#fff;font:14px/1.4 system-ui,sans-serif;
              padding:10px 14px;text-align:center;">
    <strong>Some app files didn&rsquo;t load.</strong>
    Your data is safe, but the screen may look plain and some buttons may not respond.
    Press <strong>Ctrl&nbsp;+&nbsp;R</strong> to reload. If it keeps happening, restart the app with start.bat.
  </div>
  <script>
    // Tailwind's CDN script defines window.tailwind; htmx defines window.htmx.
    // If either is missing shortly after load, something didn't download.
    window.addEventListener('load', function () {
      setTimeout(function () {
        // Everything the app needs is served locally now, so this should
        // never fire. Kept as a safety net: if htmx or the stylesheet fail
        // to load for any reason, say so in plain language instead of
        // leaving a broken-looking screen with no explanation.
        var cssOk = Array.from(document.styleSheets).some(function (sh) {
          return (sh.href || '').indexOf('/static/vendor/tailwind.css') !== -1;
        });
        var missing = (typeof window.htmx === 'undefined') || !cssOk;
        if (missing) {
          var b = document.getElementById('ntc-offline-banner');
          if (b) { b.style.display = 'block'; document.body.style.paddingTop = '52px'; }
        }
      }, 1200);
    });
  </script>
  {% block body %}
  <main class="max-w-5xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
