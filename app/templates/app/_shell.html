{% extends "base.html" %}
{% block content %}
<script>window.ntcRequireAuth();</script>

<div class="flex items-center justify-between mb-6 pb-3 border-b border-gray-200">
  <div class="flex items-center gap-4">
    <a href="/app" class="font-semibold text-lg">NTC Licensing</a>
    <a href="/app" class="text-sm text-gray-600 hover:text-gray-900">Search</a>
    <a href="/app/licenses/new" class="text-sm text-gray-600 hover:text-gray-900">+ New License</a>
  </div>
  <div class="flex items-center gap-3 text-sm text-gray-500">
    <span id="ntc-whoami"></span>
    <button onclick="window.ntcLogout()" class="text-red-600 hover:text-red-800">Log out</button>
  </div>
</div>
<script>document.getElementById('ntc-whoami').textContent = window.ntcUser() + ' (' + window.ntcRole() + ')';</script>

{% block app_content %}{% endblock %}
{% endblock %}
