{% extends "base.html" %}
{% block title %}Sign in — NTC Licensing{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-sidebar px-4">
  <div class="w-full max-w-sm">

    <div class="flex flex-col items-center mb-6">
      <div class="w-12 h-12 rounded bg-brand-500 flex items-center justify-center text-white font-bold text-xl mb-3">N</div>
      <h1 class="text-white text-lg font-semibold tracking-wide">NTC Licensing</h1>
      <p class="text-gray-400 text-xs mt-1">Sign in to continue</p>
    </div>

    <div class="bg-white rounded-md shadow-lg p-6">
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Username</label>
          <input name="username" type="text" required autofocus
                 class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Password</label>
          <input name="password" type="password" required
                 class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        </div>
        <div id="login-error" class="text-sm text-red-600 bg-red-50 rounded-md px-3 py-2 hidden"></div>
        <button type="submit"
                class="w-full bg-brand-600 hover:bg-brand-700 text-white rounded-md px-3 py-2 font-medium text-sm shadow-sm transition-colors">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-xs text-gray-500 text-center mt-4">
      Same login as the classic app at <a class="underline hover:text-gray-300" href="/">/</a> — one account works on both.
    </p>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const errBox = document.getElementById('login-error');
  errBox.classList.add('hidden');
  const form = new FormData(e.target);
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: form.get('username'),
        password: form.get('password'),
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      errBox.textContent = data.detail || 'Login failed.';
      errBox.classList.remove('hidden');
      return;
    }
    localStorage.setItem('ntc_token', data.token);
    localStorage.setItem('ntc_role', data.role);
    localStorage.setItem('ntc_user', data.username);
    try { localStorage.setItem('ntc_perms', JSON.stringify(data.permissions || [])); } catch (e) {}
    window.location.href = '/app';
  } catch (err) {
    errBox.textContent = 'Could not reach the server.';
    errBox.classList.remove('hidden');
  }
});
</script>
{% endblock %}
